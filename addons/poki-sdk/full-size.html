<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		
		<!-- Poki SDK include -->
		<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
		<script>
			window.addEventListener('keydown', ev => {
				if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
					ev.preventDefault();
				}
			});
			window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });
		</script>

		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" data-godot-splash="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = typeof $GODOT_THREADS_ENABLED === 'undefined' ? false : $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
const POKI_LOCALHOSTS = new Set(['localhost', '127.0.0.1']);

function createMissingPokiSDK() {
	const missingSdkError = () => Promise.reject(new Error('Poki SDK script did not load.'));
	const noop = () => undefined;
	return {
		init: missingSdkError,
		rewardedBreak: missingSdkError,
		commercialBreak: missingSdkError,
		displayAd: missingSdkError,
		destroyAd: noop,
		shareableURL: missingSdkError,
		getURLParam: () => null,
		getLanguage: () => null,
		getUser: missingSdkError,
		getToken: missingSdkError,
		login: missingSdkError,
		captureError: noop,
		gameLoadingFinished: noop,
		gameplayStart: noop,
		gameplayStop: noop,
		setDebug: noop,
		setLogging: noop,
		enableEventTracking: noop,
		openExternalLink: noop,
		playtestSetCanvas: noop,
		playtestCaptureHtmlOnce: noop,
		playtestCaptureHtmlForce: noop,
		playtestCaptureHtmlOn: noop,
		playtestCaptureHtmlOff: noop,
		movePill: noop,
		measure: noop,
		isAdBlocked: () => false,
	};
}

const PokiSDKRaw = window.PokiSDK || createMissingPokiSDK();

function createPokiGodotBridge() {
	let godotCallback = null;

	function dispatchToGodot(eventName, callbackId, payload) {
		if (typeof godotCallback === 'function') {
			godotCallback(eventName, callbackId, payload);
		}
	}

	function callbackFromId(callbackId) {
		if (typeof callbackId !== 'number' || callbackId < 0) {
			return callbackId;
		}
		return () => dispatchToGodot('callback', callbackId, null);
	}

	function rewriteRewardedArgs(args) {
		if (typeof args[0] === 'number') {
			return [callbackFromId(args[0])];
		}
		if (args[0] && typeof args[0] === 'object' && typeof args[0].onStart === 'number') {
			const params = { ...args[0] };
			params.onStart = callbackFromId(params.onStart);
			return [params];
		}
		return args;
	}

	const initOptions = {};
	if (POKI_LOCALHOSTS.has(window.location.hostname)) {
		initOptions.debug = true;
	}
	const ready = PokiSDKRaw.init(initOptions).then(() => undefined);

	return {
		ready,
		setGodotCallback(callback) {
			godotCallback = callback;
		},
		rewardedBreak(...args) {
			return PokiSDKRaw.rewardedBreak(...rewriteRewardedArgs(args));
		},
		commercialBreak(...args) {
			if (typeof args[0] === 'number') {
				return PokiSDKRaw.commercialBreak(callbackFromId(args[0]));
			}
			return PokiSDKRaw.commercialBreak(...args);
		},
		displayAd(...args) {
			if (typeof args[2] === 'number') {
				const callbackId = args[2];
				const hasCanDestroy = args[3] === true;
				const hasDisplayRendered = args[4] === true;
				const onCanDestroy = hasCanDestroy ? () => dispatchToGodot('display_can_destroy', callbackId, null) : null;
				const onDisplayRendered = hasDisplayRendered ? (rendered) => dispatchToGodot('display_rendered', callbackId, rendered) : null;
				return PokiSDKRaw.displayAd(args[0], args[1], onCanDestroy, onDisplayRendered);
			}
			return PokiSDKRaw.displayAd(...args);
		},
		destroyAd(...args) {
			return PokiSDKRaw.destroyAd(...args);
		},
		shareableURL(...args) {
			return PokiSDKRaw.shareableURL(...args);
		},
		getURLParam(...args) {
			return PokiSDKRaw.getURLParam(...args);
		},
		getLanguage(...args) {
			return PokiSDKRaw.getLanguage(...args);
		},
		getUser(...args) {
			return PokiSDKRaw.getUser(...args);
		},
		getToken(...args) {
			return PokiSDKRaw.getToken(...args);
		},
		login(...args) {
			return PokiSDKRaw.login(...args);
		},
		captureError(...args) {
			return PokiSDKRaw.captureError(...args);
		},
		gameLoadingFinished(...args) {
			return PokiSDKRaw.gameLoadingFinished(...args);
		},
		gameplayStart(...args) {
			return PokiSDKRaw.gameplayStart(...args);
		},
		gameplayStop(...args) {
			return PokiSDKRaw.gameplayStop(...args);
		},
		setDebug(...args) {
			return PokiSDKRaw.setDebug(...args);
		},
		setLogging(...args) {
			return PokiSDKRaw.setLogging(...args);
		},
		enableEventTracking(...args) {
			return PokiSDKRaw.enableEventTracking(...args);
		},
		openExternalLink(...args) {
			return PokiSDKRaw.openExternalLink(...args);
		},
		playtestSetCanvas(...args) {
			return PokiSDKRaw.playtestSetCanvas(...args);
		},
		playtestCaptureHtmlOnce(...args) {
			return PokiSDKRaw.playtestCaptureHtmlOnce(...args);
		},
		playtestCaptureHtmlForce(...args) {
			return PokiSDKRaw.playtestCaptureHtmlForce(...args);
		},
		playtestCaptureHtmlOn(...args) {
			return PokiSDKRaw.playtestCaptureHtmlOn(...args);
		},
		playtestCaptureHtmlOff(...args) {
			return PokiSDKRaw.playtestCaptureHtmlOff(...args);
		},
		movePill(...args) {
			return PokiSDKRaw.movePill(...args);
		},
		measure(...args) {
			return PokiSDKRaw.measure(...args);
		},
		isAdBlocked(...args) {
			return PokiSDKRaw.isAdBlocked(...args);
		},
	};
}

window.PokiGodotBridge = createPokiGodotBridge();

function startGameLoading() {
	const statusOverlay = document.getElementById('status');
	const statusSplash = document.getElementById('status-splash');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	const splashImage = statusSplash.dataset.godotSplash;
	if (splashImage && splashImage !== '$' + 'GODOT_SPLASH') {
		statusSplash.src = splashImage;
	} else {
		statusSplash.remove();
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function getMissingFeatures() {
		if (typeof Engine.getMissingFeatures === 'function') {
			return Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});
		}
		if (typeof Engine.isWebGLAvailable === 'function' && !Engine.isWebGLAvailable()) {
			return ['WebGL'];
		}
		return [];
	}

	const missing = getMissingFeatures();
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	}).then(() => {
		setStatusMode('hidden');
		initializing = false;
		window.PokiGodotBridge.gameLoadingFinished();
	}, displayFailureNotice);
}

window.PokiGodotBridge.ready.then(() => {
	startGameLoading();
}).catch(() => {
	startGameLoading();
});
			</script>
		</body>
	</html>
